<!-- Shared bilingual navigation and accessible theme-control labels. -->
<script>
(function () {
  "use strict";

  const pages = {
    home: {
      en: "index.html",
      ko: "ko/index.html"
    },
    w1: {
      en: "chapters/part1/w1_intro.html",
      ko: "ko/chapters/part1/w1_intro.html"
    },
    w2: {
      en: "chapters/part1/w2_scripts_ai.html",
      ko: "ko/chapters/part1/w2_scripts_ai.html"
    },
    w3: {
      en: "chapters/part2/w3_gwas.html",
      ko: "ko/chapters/part2/w3_gwas.html"
    },
    w4: {
      en: "chapters/part2/w4_prs.html",
      ko: "ko/chapters/part2/w4_prs.html"
    },
    w5: {
      en: "chapters/part3/w5_scrna_qc.html",
      ko: "ko/chapters/part3/w5_scrna_qc.html"
    },
    w6: {
      en: "chapters/part3/w6_scrna_dynamics.html",
      ko: "ko/chapters/part3/w6_scrna_dynamics.html"
    },
    w7: {
      en: "chapters/part4/w7_spatial_basics.html",
      ko: "ko/chapters/part4/w7_spatial_basics.html"
    },
    w8: {
      en: "chapters/part4/w8_spatial_integration.html",
      ko: "ko/chapters/part4/w8_spatial_integration.html"
    },
    w9: {
      en: "chapters/part5/w9_proteomics_tech.html",
      ko: "ko/chapters/part5/w9_proteomics_tech.html"
    },
    w10: {
      en: "chapters/part5/w10_clinical_proteomics.html",
      ko: "ko/chapters/part5/w10_clinical_proteomics.html"
    },
    w11: {
      en: "chapters/part6/w11_multiomics.html",
      ko: "ko/chapters/part6/w11_multiomics.html"
    },
    w12: {
      en: "chapters/part6/w12_network_drug.html",
      ko: "ko/chapters/part6/w12_network_drug.html"
    },
    w13: {
      en: "chapters/part7/w13_visualization.html",
      ko: "ko/chapters/part7/w13_visualization.html"
    },
    w14: {
      en: "chapters/part7/w14_project_design.html",
      ko: "ko/chapters/part7/w14_project_design.html"
    }
  };

  function detectPage() {
    const path = window.location.pathname;

    for (const [key, routes] of Object.entries(pages)) {
      // Check the longer Korean route first because its suffix also contains
      // the corresponding English route (for example, ko/.../w1_intro.html).
      for (const language of ["ko", "en"]) {
        const route = routes[language];
        if (path === "/" + route || path.endsWith("/" + route)) {
          return {
            key,
            language,
            basePath: path.slice(0, -route.length)
          };
        }
      }
    }

    if (path.endsWith("/ko/")) {
      return {
        key: "home",
        language: "ko",
        basePath: path.slice(0, -3)
      };
    }

    if (path.endsWith("/")) {
      return {
        key: "home",
        language: "en",
        basePath: path
      };
    }

    return {
      key: null,
      language: document.documentElement.lang.toLowerCase().startsWith("ko") ? "ko" : "en",
      basePath: null
    };
  }

  function routeUrl(state, language, key) {
    const route = pages[key] && pages[key][language];
    if (!route || !state.basePath) return null;
    return new URL(state.basePath + route, window.location.href).href;
  }

  // One button that links to the *other* language of the current page
  // (like the theme button, it shows what you get when you click it).
  function makeLanguageOption(label, language, state) {
    const href = state.key ? routeUrl(state, language, state.key) : null;
    const option = document.createElement(href ? "a" : "span");

    option.textContent = label;
    option.lang = language;

    if (href) {
      option.href = href;
      option.hreflang = language;
      option.setAttribute(
        "aria-label",
        language === "ko" ? "이 페이지를 한국어로 보기" : "View this page in English"
      );
    } else {
      option.className = "is-unavailable";
      option.setAttribute("aria-disabled", "true");
      option.title = language === "ko" ? "한국어 번역 준비 중" : "English page unavailable";
    }

    return option;
  }

  function addLanguageSwitch(state) {
    let tools = document.querySelector(".quarto-navbar-tools");

    if (!tools) {
      const navbar = document.querySelector("#quarto-header .navbar");
      if (!navbar) return;
      tools = document.createElement("div");
      tools.className = "quarto-navbar-tools";
      navbar.appendChild(tools);
    }

    const control = document.createElement("nav");
    control.className = "course-language-switch";
    control.setAttribute(
      "aria-label",
      state.language === "ko" ? "언어 선택" : "Language selector"
    );
    const other = state.language === "ko" ? "en" : "ko";
    control.append(makeLanguageOption(other.toUpperCase(), other, state));

    const themeToggle = tools.querySelector(".quarto-color-scheme-toggle");
    tools.insertBefore(control, themeToggle || tools.firstChild);
  }

  function localizeKoreanNavbar(state) {
    if (state.language !== "ko" || !state.basePath) return;

    const links = Array.from(document.querySelectorAll("#quarto-header .navbar-nav .nav-link"));
    const homeLink = links.find((link) => link.textContent.trim() === "Home");
    const weeksLink = links.find((link) => link.textContent.trim() === "Weeks");

    if (homeLink) {
      homeLink.textContent = "홈";
      homeLink.href = routeUrl(state, "ko", "home");
    }

    if (!weeksLink) return;
    weeksLink.textContent = "주차별 강의";

    const dropdown = weeksLink.closest(".dropdown");
    const menu = dropdown && dropdown.querySelector(".dropdown-menu");
    if (!menu) return;

    const translatedWeeks = [
      ["w1", "W1 · 소개와 로드맵"],
      ["w2", "W2 · R 스크립트, AI 보조 코딩과 재현성"],
      ["w3", "W3 · GWAS와 Post-GWAS"],
      ["w4", "W4 · 다유전자 위험 점수(PRS)"],
      ["w5", "W5 · 단일세포 RNA-seq: 기술, QC, 클러스터링"],
      ["w6", "W6 · 통합, 궤적, 유전자 조절과 세포 간 소통"],
      ["w7", "W7 · 공간전사체학의 기초"],
      ["w8", "W8 · 디콘볼루션과 공간 통합"],
      ["w9", "W9 · 단백질을 실제로 측정하는 방법"],
      ["w10", "W10 · 임상 단백체학과 바이오마커"],
      ["w11", "W11 · 다중오믹스 통합"],
      ["w12", "W12 · 네트워크 분석과 약물 표적"],
      ["w13", "W13 · 해석과 시각화"],
      ["w14", "W14 · 나만의 프로젝트 설계"]
    ];
    const items = translatedWeeks.map(([key, label]) => {
      const item = document.createElement("li");
      const link = document.createElement("a");
      const text = document.createElement("span");
      link.className = "dropdown-item";
      link.href = routeUrl(state, "ko", key);
      text.className = "dropdown-text";
      text.textContent = label;
      link.appendChild(text);
      item.appendChild(link);
      return item;
    });
    menu.replaceChildren(...items);
  }

  function updateThemeLabel(state) {
    const toggle = document.querySelector(".quarto-color-scheme-toggle");
    if (!toggle) return;

    const isDark = document.body.classList.contains("quarto-dark") ||
      document.documentElement.getAttribute("data-bs-theme") === "dark";
    const label = state.language === "ko"
      ? (isDark ? "라이트 모드로 전환" : "다크 모드로 전환")
      : (isDark ? "Switch to light mode" : "Switch to dark mode");

    toggle.setAttribute("aria-label", label);
    toggle.title = label;
  }

  function init() {
    const state = detectPage();
    addLanguageSwitch(state);
    localizeKoreanNavbar(state);
    updateThemeLabel(state);

    const observer = new MutationObserver(() => updateThemeLabel(state));
    observer.observe(document.body, { attributes: true, attributeFilter: ["class"] });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["data-bs-theme"]
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>

<!-- Fold executed-code output (stdout, messages, figures) under one collapsed <details> per cell. -->
<script>
(function () {
  "use strict";

  function foldCellOutputs() {
    const label = document.documentElement.lang.startsWith("ko") ? "결과 보기" : "Show output";

    document.querySelectorAll(".cell").forEach((cell) => {
      const outputs = Array.from(cell.children).filter((el) =>
        Array.from(el.classList).some((c) => c.startsWith("cell-output"))
      );
      if (outputs.length === 0) return;

      const details = document.createElement("details");
      const summary = document.createElement("summary");
      details.className = "cell-output-fold";
      summary.textContent = label;
      details.appendChild(summary);
      details.append(...outputs);
      cell.append(details);   // always below the code, even if knitr split the chunk
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", foldCellOutputs, { once: true });
  } else {
    foldCellOutputs();
  }
})();
</script>

<!-- Key terms: the first time a term from the chapter's "Key terms" table appears
     in the text, underline it and show the table's definition on hover / tap / focus. -->
<script>
(function () {
  "use strict";

  const SKIP = "pre, code, a, h1, h2, h3, h4, h5, h6, script, style, svg, mjx-container, .math, " +
    "figcaption, .callout-header, .cell-output, .cell-output-fold, .quarto-title-block, .glossary-term";

  function keyTermsSection(main) {
    return Array.from(main.querySelectorAll("section.level1")).find((section) => {
      const heading = section.querySelector(":scope > h1");
      return heading && /Key terms|핵심 용어/.test(heading.textContent);
    });
  }

  // "Linkage disequilibrium (LD)" → LD is another name; "TMT (isobaric labelling)" →
  // the bracket is only tried if "TMT" never appears. "PRS / PGS" → either one.
  function aliases(term) {
    const bracket = term.match(/^(.*?)\s*\(([^)]+)\)$/);
    const main = (bracket ? bracket[1] : term).split(/\s+\/\s+/);
    const fallback = [];
    if (bracket) (/^[A-Z]/.test(bracket[2]) ? main : fallback).push(bracket[2]);
    return [main, fallback];
  }

  function toRegex(alias) {
    const escaped = alias.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/ /g, "\\s+");
    // acronyms (two or more capitals) must match exactly; ordinary words ignore case
    const flags = (alias.match(/[A-Z]/g) || []).length >= 2 ? "" : "i";
    return new RegExp("(?<![\\w-])" + escaped + "(?:e?s)?(?![\\w-])", flags);
  }

  function makeWalker(main, isSkipped) {
    return document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!node.nodeValue.trim() || !parent || parent.closest(SKIP) || isSkipped(node)) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
  }

  function findFirst(main, isSkipped, words) {
    const patterns = words.map(toRegex);
    const walker = makeWalker(main, isSkipped);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      let best = null;
      for (const pattern of patterns) {
        const match = pattern.exec(node.nodeValue);
        if (match && (!best || match.index < best.index)) best = match;
      }
      if (best) return { node, index: best.index, length: best[0].length };
    }
    return null;
  }

  function attach(span, term, definition) {
    span.className = "glossary-term";
    span.tabIndex = 0;
    if (!window.tippy) {
      span.title = term + ": " + definition;
      return;
    }
    const tip = document.createElement("div");
    const name = document.createElement("strong");
    tip.className = "glossary-tip";
    name.textContent = term;
    tip.append(name, definition);
    window.tippy(span, {
      content: tip,
      theme: "quarto",
      placement: "bottom-start",
      maxWidth: 360,
      arrow: false,
      delay: [100, 0],
      appendTo: () => document.body
    });
  }

  function init() {
    const main = document.querySelector("#quarto-document-content");
    const glossary = main && keyTermsSection(main);
    if (!glossary) return;

    // only the chapter text before the table counts; the learning-objectives box is skipped
    const objectives = Array.from(main.querySelectorAll(".callout")).filter((callout) => {
      const title = callout.querySelector(".callout-title-container");
      return title && title.textContent.includes("🎯");
    });
    const isSkipped = (node) =>
      !(node.compareDocumentPosition(glossary) & Node.DOCUMENT_POSITION_FOLLOWING) ||
      objectives.some((box) => box.contains(node));

    const entries = Array.from(glossary.querySelectorAll("tbody tr")).map((row) => {
      const [termCell, definitionCell] = row.querySelectorAll("td");
      if (!termCell || !definitionCell) return null;
      const term = termCell.textContent.trim();
      const code = termCell.querySelector("code");
      return {
        term,
        definition: definitionCell.textContent.trim(),
        isCode: !!code && code.textContent.trim() === term,
        names: aliases(term)
      };
    }).filter(Boolean);

    // longer names first, so "LD-score regression" is claimed before "LD"
    const longest = (entry) => Math.max(...entry.names[0].map((name) => name.length));
    entries.sort((a, b) => longest(b) - longest(a));

    for (const entry of entries) {
      const span = document.createElement("span");

      if (entry.isCode) {
        const code = Array.from(main.querySelectorAll("code")).find((el) =>
          el.textContent.trim() === entry.term && !el.closest("pre, a, .glossary-term") && !isSkipped(el));
        if (!code) continue;
        code.replaceWith(span);
        span.appendChild(code);
      } else {
        const hit = findFirst(main, isSkipped, entry.names[0]) ||
          (entry.names[1].length ? findFirst(main, isSkipped, entry.names[1]) : null);
        if (!hit) continue;
        const range = document.createRange();
        range.setStart(hit.node, hit.index);
        range.setEnd(hit.node, hit.index + hit.length);
        range.surroundContents(span);
      }
      attach(span, entry.term, entry.definition);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init, { once: true });
  } else {
    init();
  }
})();
</script>
