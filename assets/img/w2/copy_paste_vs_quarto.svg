<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="400" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">Reviewer: "please exclude the three patients who withdrew and re-run."</text>

  <!-- LEFT -->
  <rect x="24" y="48" width="400" height="288" rx="10" fill="#ffffff" stroke="#D85A30" stroke-width="2"/>
  <rect x="24" y="48" width="400" height="40" rx="10" fill="#fbeee8"/>
  <rect x="24" y="78" width="400" height="10" fill="#fbeee8"/>
  <text x="48" y="74" font-size="14" font-weight="700" fill="#a8401d">❌ Copy-paste pipeline</text>

  <g font-size="12.5" fill="#666">
    <text x="48" y="112">R console prints <tspan font-family="monospace" font-size="11.5" fill="#4A3D6B">847</tspan></text>
    <text x="48" y="140">➝ typed into the Word manuscript</text>
    <text x="48" y="168">➝ figure exported, dragged into the doc</text>
    <text x="48" y="196">➝ table screenshotted into slide 12</text>
    <text x="48" y="224">➝ abstract quotes <tspan font-family="monospace" font-size="11.5" fill="#4A3D6B">847</tspan> again</text>
  </g>

  <rect x="48" y="242" width="352" height="76" rx="7" fill="#fbeee8"/>
  <text x="68" y="266" font-size="12.5" font-weight="700" fill="#a8401d">Now the number becomes 831.</text>
  <text x="68" y="286" font-size="12.5" fill="#a05a3f">Five places to update by hand. You will find four.</text>
  <text x="68" y="306" font-size="12.5" fill="#a05a3f">The fifth is in the abstract.</text>

  <!-- RIGHT -->
  <rect x="456" y="48" width="400" height="288" rx="10" fill="#ffffff" stroke="#1D9E75" stroke-width="2"/>
  <rect x="456" y="48" width="400" height="40" rx="10" fill="#e8f5f0"/>
  <rect x="456" y="78" width="400" height="10" fill="#e8f5f0"/>
  <text x="480" y="74" font-size="14" font-weight="700" fill="#0F6E56">✅ Quarto document</text>

  <rect x="480" y="102" width="352" height="34" rx="5" fill="#f5f5f5"/>
  <text x="492" y="124" font-family="monospace" font-size="11.5" fill="#666">We found `r nrow(sig)` genes (FDR &lt; 0.05).</text>

  <g font-size="12.5" fill="#666">
    <text x="480" y="160">Figures generated by the code that made them</text>
    <text x="480" y="184">Tables generated the same way</text>
    <text x="480" y="208">Methods text sits beside the code it describes</text>
  </g>

  <rect x="480" y="228" width="352" height="90" rx="7" fill="#e8f5f0"/>
  <text x="500" y="252" font-size="12.5" font-weight="700" fill="#0F6E56">Add one filter line, re-render.</text>
  <text x="500" y="272" font-size="12.5" fill="#3d7a68">Every number, figure and table updates together.</text>
  <text x="500" y="296" font-family="monospace" font-size="11.5" fill="#4A3D6B">quarto render manuscript.qmd</text>

  <!-- footer -->
  <rect x="24" y="352" width="832" height="36" rx="8" fill="#f7f5fa" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="48" y="375" font-size="12.5" fill="#555">💡 The point is not elegance. It is that a manuscript with hand-typed numbers is <tspan font-weight="700" fill="#4A3D6B">guaranteed</tspan> to disagree with itself eventually.</text>
</svg>
