<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="470" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">"Enriched for immune response" — the most common sentence in omics, and the least informative.</text>

  <!-- typical output -->
  <rect x="24" y="46" width="410" height="256" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="46" y="72" font-size="13" font-weight="700" fill="#4A3D6B">What GO enrichment usually returns</text>
  <g font-size="11.5">
    <text x="46" y="102" fill="#555">immune system process</text><rect x="272" y="92" width="140" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="126" fill="#555">immune response</text><rect x="272" y="116" width="128" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="150" fill="#555">defense response</text><rect x="272" y="140" width="120" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="174" fill="#555">response to stimulus</text><rect x="272" y="164" width="112" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="198" fill="#555">regulation of immune response</text><rect x="272" y="188" width="98" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="222" fill="#555">cell activation</text><rect x="272" y="212" width="86" height="12" rx="3" fill="#185FA5"/>
    <text x="46" y="246" fill="#555">leukocyte activation</text><rect x="272" y="236" width="74" height="12" rx="3" fill="#185FA5"/>
  </g>
  <text x="46" y="276" font-size="11.5" fill="#8A7FA3">−log₁₀(adjusted p), all &lt; 10⁻¹⁰</text>
  <text x="46" y="294" font-size="11.5" font-weight="700" fill="#a8401d">⚠️ Seven terms. One fact.</text>

  <!-- three problems -->
  <rect x="446" y="46" width="410" height="80" rx="9" fill="#ffffff" stroke="#D85A30" stroke-width="1.8"/>
  <text x="470" y="70" font-size="12.5" font-weight="700" fill="#4A3D6B">① The terms are nested, not independent</text>
  <text x="470" y="92" font-size="11.5" fill="#666">GO is a hierarchy. "Immune response" contains most of the</text>
  <text x="470" y="110" font-size="11.5" fill="#666">others. ✅ Collapse redundancy (REVIGO, simplify) before plotting.</text>

  <rect x="446" y="134" width="410" height="80" rx="9" fill="#ffffff" stroke="#D85A30" stroke-width="1.8"/>
  <text x="470" y="158" font-size="12.5" font-weight="700" fill="#4A3D6B">② The background is usually wrong</text>
  <text x="470" y="180" font-size="11.5" fill="#666">Default is "all genes". ⚠️ Your universe is the genes that were</text>
  <text x="470" y="198" font-size="11.5" fill="#666"><tspan font-weight="700" fill="#a8401d">expressed and testable</tspan> in your tissue — often half as many.</text>

  <rect x="446" y="222" width="410" height="80" rx="9" fill="#ffffff" stroke="#D85A30" stroke-width="1.8"/>
  <text x="470" y="246" font-size="12.5" font-weight="700" fill="#4A3D6B">③ Annotation follows attention</text>
  <text x="470" y="268" font-size="11.5" fill="#666">Immune genes are heavily annotated; many genes have no GO</text>
  <text x="470" y="286" font-size="11.5" fill="#666">terms at all. The same study bias as W12, one layer up.</text>

  <!-- what to do -->
  <rect x="24" y="318" width="832" height="134" rx="10" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.8"/>
  <text x="48" y="344" font-size="13.5" font-weight="700" fill="#0F6E56">✅ What to do instead</text>
  <text x="48" y="370" font-size="12.5" fill="#3d7a68"><tspan font-weight="700" fill="#0F6E56">Set the right background</tspan> — the genes actually tested, not the whole genome. One argument; it changes the answer.</text>
  <text x="48" y="392" font-size="12.5" fill="#3d7a68"><tspan font-weight="700" fill="#0F6E56">Use GSEA on the ranked list</tspan> rather than a cut-off list — no arbitrary threshold, and it uses the effect sizes.</text>
  <text x="48" y="414" font-size="12.5" fill="#3d7a68"><tspan font-weight="700" fill="#0F6E56">Prefer specific gene sets</tspan> — Hallmark, Reactome pathways, or a curated set for your disease, over top-level GO.</text>
  <text x="48" y="436" font-size="12.5" fill="#3d7a68"><tspan font-weight="700" fill="#0F6E56">Then name genes.</tspan> "Enriched for interferon signalling, driven by <tspan font-style="italic">IFI44L</tspan>, <tspan font-style="italic">ISG15</tspan> and <tspan font-style="italic">MX1</tspan>" is a sentence a reader can act on.</text>
</svg>
