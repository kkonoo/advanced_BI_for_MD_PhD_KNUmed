<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect width="880" height="420" fill="#fcfcfb"/>
<text x="24.0" y="30.0" font-size="15" fill="#4A3D6B" font-weight="700">Order the figures by the argument: each figure answers the question the last one left.</text>
<text x="856.0" y="52.0" font-size="11" fill="#8A7FA3" text-anchor="end">(illustration: simulated study)</text>
<text x="24.0" y="56.0" font-size="11" fill="#4A3D6B" font-weight="700" letter-spacing="1">MAIN FIGURES</text>
<circle cx="46.0" cy="88.0" r="15.0" fill="#4A3D6B"/><text x="46.0" y="93.5" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<text x="70.0" y="93.0" font-size="13" fill="#4A3D6B" font-weight="700">Figure 1</text>
<rect x="24" y="114" width="240" height="56" rx="8" fill="#f1eef7"/>
<text x="38.0" y="132.0" font-size="11.5" fill="#8A7FA3" font-weight="700">Q:</text>
<text x="60.0" y="132.0" font-size="12" fill="#4A3D6B">Does infection change the</text>
<text x="60.0" y="149.0" font-size="12" fill="#4A3D6B">spleen's immune cells?</text>
<rect x="24" y="178" width="240" height="74" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
<text x="38.0" y="199.0" font-size="12.5" fill="#0F6E56" font-weight="600">Neutrophils expand most</text>
<text x="38.0" y="217.0" font-size="12.5" fill="#0F6E56" font-weight="600">in the infected spleen (3.5×).</text>
<text x="38.0" y="270.0" font-size="10.5" fill="#888">plot: composition bars, sorted by fold</text>
<circle cx="342.0" cy="88.0" r="15.0" fill="#4A3D6B"/><text x="342.0" y="93.5" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<text x="366.0" y="93.0" font-size="13" fill="#4A3D6B" font-weight="700">Figure 2</text>
<rect x="320" y="114" width="240" height="56" rx="8" fill="#f1eef7"/>
<text x="334.0" y="132.0" font-size="11.5" fill="#8A7FA3" font-weight="700">Q:</text>
<text x="356.0" y="132.0" font-size="12" fill="#4A3D6B">Which neutrophils</text>
<text x="356.0" y="149.0" font-size="12" fill="#4A3D6B">are added?</text>
<rect x="320" y="178" width="240" height="74" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
<text x="334.0" y="199.0" font-size="12.5" fill="#0F6E56" font-weight="600">Most added neutrophils are</text>
<text x="334.0" y="217.0" font-size="12.5" fill="#0F6E56" font-weight="600">immature (15% → 44% of</text>
<text x="334.0" y="235.0" font-size="12.5" fill="#0F6E56" font-weight="600">neutrophils).</text>
<text x="334.0" y="270.0" font-size="10.5" fill="#888">plot: stacked columns by subset</text>
<circle cx="638.0" cy="88.0" r="15.0" fill="#4A3D6B"/><text x="638.0" y="93.5" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<text x="662.0" y="93.0" font-size="13" fill="#4A3D6B" font-weight="700">Figure 3</text>
<rect x="616" y="114" width="240" height="56" rx="8" fill="#f1eef7"/>
<text x="630.0" y="132.0" font-size="11.5" fill="#8A7FA3" font-weight="700">Q:</text>
<text x="652.0" y="132.0" font-size="12" fill="#4A3D6B">Does it hold in</text>
<text x="652.0" y="149.0" font-size="12" fill="#4A3D6B">each mouse?</text>
<rect x="616" y="178" width="240" height="74" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.5"/>
<text x="630.0" y="199.0" font-size="12.5" fill="#0F6E56" font-weight="600">Immature neutrophils rise in</text>
<text x="630.0" y="217.0" font-size="12.5" fill="#0F6E56" font-weight="600">every infected mouse by flow</text>
<text x="630.0" y="235.0" font-size="12.5" fill="#0F6E56" font-weight="600">cytometry (n = 6 per group).</text>
<text x="630.0" y="270.0" font-size="10.5" fill="#888">plot: points per mouse</text>
<line x1="274.0" y1="142.0" x2="302.0" y2="142.0" stroke="#8A7FA3" stroke-width="1.5"/><path d="M302,137 L310,142 L302,147 Z" fill="#8A7FA3" stroke="none" stroke-width="1"/>
<text x="292.0" y="130.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">next</text>
<text x="292.0" y="162.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">question</text>
<line x1="570.0" y1="142.0" x2="598.0" y2="142.0" stroke="#8A7FA3" stroke-width="1.5"/><path d="M598,137 L606,142 L598,147 Z" fill="#8A7FA3" stroke="none" stroke-width="1"/>
<text x="588.0" y="130.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">next</text>
<text x="588.0" y="162.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">question</text>
<text x="24.0" y="292.0" font-size="11" fill="#777" font-weight="700" letter-spacing="1">SUPPLEMENT</text>
<text x="118.0" y="292.0" font-size="11" fill="#999">supports a figure but has no conclusion sentence of its own</text>
<rect x="24" y="304" width="197" height="50" rx="8" fill="#f4f4f2" stroke="#c9c9c4" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="38.0" y="334.0" font-size="11.5" fill="#555">QC and doublet removal</text>
<rect x="236" y="304" width="197" height="50" rx="8" fill="#f4f4f2" stroke="#c9c9c4" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="250.0" y="325.0" font-size="11.5" fill="#555">marker dot plot used to</text>
<text x="250.0" y="342.0" font-size="11.5" fill="#555">name the clusters</text>
<rect x="448" y="304" width="197" height="50" rx="8" fill="#f4f4f2" stroke="#c9c9c4" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="462.0" y="325.0" font-size="11.5" fill="#555">same result at other</text>
<text x="462.0" y="342.0" font-size="11.5" fill="#555">clustering resolutions</text>
<rect x="660" y="304" width="197" height="50" rx="8" fill="#f4f4f2" stroke="#c9c9c4" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="674.0" y="325.0" font-size="11.5" fill="#555">Table S1: all DE genes</text>
<text x="674.0" y="342.0" font-size="11.5" fill="#555">(a table, not a figure)</text>
<rect x="24" y="370" width="832" height="38" rx="9" fill="#f7f5fa" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="48.0" y="394.0" font-size="12.5" fill="#555">💡 Read only the conclusion sentences, in order. They should read like the results part of the abstract.</text>
</svg>
