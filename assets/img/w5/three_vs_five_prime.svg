  <text x="212" y="204" font-size="10.5" font-weight="700" fill="#a8401d" text-anchor="middle">V(D)J: no reads ❌</text>
  <text x="40" y="206" font-size="11" fill="#8A7FA3">where the</text>
  <text x="40" y="221" font-size="11" fill="#8A7FA3">reads land</text>
  <text x="616" y="76" font-size="14" font-weight="700" fill="#185FA5">3′ kit — the default</text>
  <text x="616" y="100" font-size="12" fill="#555">bead: <tspan fill="#1D9E75" font-weight="700">barcode</tspan> · <tspan fill="#BA7517" font-weight="700">UMI</tspan> · <tspan fill="#5B4D80" font-weight="700">poly(dT)</tspan></text>
  <text x="616" y="126" font-size="12" fill="#555">poly(dT) on the bead grabs the</text>
  <text x="616" y="143" font-size="12" fill="#555">poly(A) tail → the barcode joins</text>
  <text x="616" y="160" font-size="12" fill="#555">the 3′ end of the transcript.</text>
  <text x="616" y="188" font-size="12" font-weight="700" fill="#0F6E56">✅ gene expression; most atlases</text>
  <text x="616" y="208" font-size="12" font-weight="700" fill="#a8401d">❌ V(D)J is too far from the tail</text>
  <rect x="24" y="258" width="832" height="200" rx="10" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
  <text x="212" y="316" font-size="10.5" font-weight="700" fill="#534AB7" text-anchor="middle">V(D)J</text>
  <rect x="168" y="384" width="88" height="54" fill="#534AB7" fill-opacity="0.08"/>
