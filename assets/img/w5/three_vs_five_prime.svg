  <text x="262" y="420" font-size="10.5" font-weight="700" fill="#0F6E56">← V(D)J covered ✅</text>
  <text x="40" y="418" font-size="11" fill="#8A7FA3">where the</text>
  <text x="40" y="433" font-size="11" fill="#8A7FA3">reads land</text>
  <text x="616" y="288" font-size="14" font-weight="700" fill="#534AB7">5′ kit — immune repertoire</text>
  <text x="616" y="312" font-size="12" fill="#555">bead: <tspan fill="#1D9E75" font-weight="700">barcode</tspan> · <tspan fill="#BA7517" font-weight="700">UMI</tspan> · <tspan fill="#3a8fd0" font-weight="700">TSO</tspan></text>
  <text x="616" y="338" font-size="12" fill="#555">A free poly(dT) primer starts RT;</text>
  <text x="616" y="355" font-size="12" fill="#555">at the cap the enzyme switches onto</text>
  <text x="616" y="372" font-size="12" fill="#555">the bead's TSO (template switching)</text>
  <text x="616" y="389" font-size="12" fill="#555">→ the barcode joins the 5′ end.</text>
  <text x="616" y="416" font-size="12" font-weight="700" fill="#0F6E56">✅ TCR/BCR + gene expression,</text>
  <text x="616" y="433" font-size="12" font-weight="700" fill="#0F6E56">from the same cells</text>
  <rect x="24" y="470" width="832" height="58" rx="8" fill="#fbf7ee" stroke="#e5d3b3" stroke-width="1.5"/>
  <text x="48" y="494" font-size="13" font-weight="700" fill="#7a5f2a">💡 Reads come from whichever end carries the barcode.</text>
  <text x="48" y="514" font-size="12.5" fill="#7a5f2a">3′: the bead grabs the poly(A) tail.   5′: the bead's TSO is copied onto the cap end.   V(D)J sits near the 5′ end.</text>
</svg>
