  <circle cx="140" cy="330" r="5.5" fill="#8A7FA3"/>
  <text x="130" y="334" font-size="12" font-weight="700" fill="#4A3D6B" text-anchor="end">5′</text>
  <text x="526" y="326" font-size="12" font-weight="700" fill="#4A3D6B">3′</text>
  <circle cx="62" cy="344" r="18" fill="#534AB7"/>
  <text x="62" y="348" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">bead</text>
  <rect x="80" y="339" width="21" height="11" rx="2" fill="#1D9E75"/>
  <text x="90.5" y="347.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">BC</text>
  <rect x="101" y="339" width="21" height="11" rx="2" fill="#BA7517"/>
  <text x="111.5" y="347.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">UMI</text>
  <rect x="122" y="339" width="21" height="11" rx="2" fill="#3a8fd0"/>
  <text x="132.5" y="347.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">TSO</text>
  <rect x="486" y="339" width="34" height="11" rx="2" fill="#5B4D80"/>
  <text x="503.0" y="347.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">TTTT</text>
  <text x="526" y="348" font-size="10" fill="#8A7FA3">free primer</text>
  <line x1="486" y1="358" x2="153" y2="358" stroke="#5B4D80" stroke-width="2"/>
  <path d="M146 358 l8 -4.5 v9 z" fill="#5B4D80"/>
  <text x="316" y="374" font-size="10.5" fill="#8A7FA3" text-anchor="middle">reverse transcription starts at the tail, reaches the cap, then copies the bead's TSO</text>
