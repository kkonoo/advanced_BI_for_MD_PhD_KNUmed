  <text x="130" y="116" font-size="12" font-weight="700" fill="#4A3D6B" text-anchor="end">5′</text>
  <text x="526" y="108" font-size="12" font-weight="700" fill="#4A3D6B">3′</text>
  <rect x="486" y="120" width="34" height="11" rx="2" fill="#5B4D80"/>
  <text x="503.0" y="128.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">TTTT</text>
  <rect x="520" y="120" width="21" height="11" rx="2" fill="#BA7517"/>
  <text x="530.5" y="128.5" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle">UMI</text>
