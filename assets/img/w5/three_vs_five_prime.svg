<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="540" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">3′ or 5′: the end that gets the barcode is the end that gets read.</text>
  <rect x="24" y="46" width="832" height="200" rx="10" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
  <text x="156" y="98" font-size="9.5" fill="#8A7FA3" text-anchor="middle">5′ UTR</text>
  <text x="212" y="98" font-size="10.5" font-weight="700" fill="#534AB7" text-anchor="middle">V(D)J</text>
  <text x="308" y="98" font-size="9.5" fill="#8A7FA3" text-anchor="middle">C (constant)</text>
  <text x="423" y="98" font-size="9.5" fill="#8A7FA3" text-anchor="middle">3′ UTR</text>
  <text x="503" y="98" font-size="9.5" fill="#8A7FA3" text-anchor="middle">poly(A)</text>
  <text x="40" y="70" font-size="10.5" fill="#8A7FA3">an mRNA (here a TCR transcript)</text>
