  <rect x="455.9" y="197.6" width="12.3" height="38.4" rx="1.5" fill="#D85A30" fill-opacity="0.8"/>
  <rect x="474.2" y="214.4" width="9.7" height="21.6" rx="1.5" fill="#D85A30" fill-opacity="0.8"/>
  <rect x="489.9" y="192.8" width="13.8" height="43.2" rx="1.5" fill="#D85A30" fill-opacity="0.8"/>
  <rect x="509.7" y="202.4" width="11.2" height="33.6" rx="1.5" fill="#D85A30" fill-opacity="0.8"/>
  <rect x="526.9" y="130.4" width="31.0" height="105.6" rx="1.5" fill="#D85A30" fill-opacity="0.8"/>
  <text x="373.7" y="250.0" font-size="10" fill="#555" text-anchor="middle">R1–R6</text>
  <text x="498.6" y="250.0" font-size="10" fill="#555" text-anchor="middle">NR1–NR6</text>
  <text x="538.4" y="124.4" font-size="10" fill="#a8401d" font-weight="700" text-anchor="end">NR6: big section, big niche</text>
  <text x="440.0" y="264.0" font-size="10" fill="#8A7FA3" text-anchor="middle">bar width = spots in that section</text>
  <text x="325.0" y="296.0" font-size="11.5" fill="#666">Each patient → one niche fraction</text>
  <text x="325.0" y="312.0" font-size="11.5" fill="#4A3D6B" font-weight="700">→ n = patients, not spots</text>
  <path d="M575 186 L580 186" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M588 186 l-9 -5 v10 z" fill="#b9b0cc"/>
