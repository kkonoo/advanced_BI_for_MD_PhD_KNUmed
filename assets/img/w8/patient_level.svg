<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="420" fill="#fcfcfb"/>
  <text x="24.0" y="28.0" font-size="15" fill="#4A3D6B" font-weight="700">Thousands of spots are not thousands of patients. Compare niche abundance one patient at a time.</text>
  <rect x="24" y="46" width="266" height="280" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="42.0" y="72.0" font-size="13" fill="#4A3D6B" font-weight="700">① Pool the spots</text>
  <text x="42.0" y="90.0" font-size="10.5" fill="#8A7FA3">TAM-rich niche, % of all spots</text>
  <line x1="60" y1="236" x2="260" y2="236" stroke="#cfc9dd" stroke-width="1.2"/>
  <rect x="95.0" y="187.3" width="50.0" height="48.7" rx="3" fill="#185FA5" fill-opacity="0.8"/>
  <line x1="120" y1="181.9" x2="120" y2="192.3" stroke="#4A3D6B" stroke-width="2"/>
  <text x="120.0" y="179.3" font-size="11" fill="#4A3D6B" font-weight="700" text-anchor="middle">12%</text>
  <text x="120.0" y="252.0" font-size="10" fill="#555" text-anchor="middle">R · 2,520 spots</text>
  <rect x="185.0" y="142.4" width="50.0" height="93.6" rx="3" fill="#D85A30" fill-opacity="0.8"/>
  <line x1="210" y1="136.3" x2="210" y2="148.4" stroke="#4A3D6B" stroke-width="2"/>
  <text x="210.0" y="134.4" font-size="11" fill="#4A3D6B" font-weight="700" text-anchor="middle">23%</text>
  <text x="210.0" y="252.0" font-size="10" fill="#555" text-anchor="middle">NR · 3,040 spots</text>
  <text x="157.0" y="112.0" font-size="11.5" fill="#a8401d" font-weight="700" text-anchor="middle">χ² on spots: p = 8 × 10⁻²⁷</text>
  <text x="42.0" y="296.0" font-size="11.5" fill="#666">Every spot counted as a replicate</text>
  <text x="42.0" y="312.0" font-size="11.5" fill="#a8401d" font-weight="700">→ a tiny p from one tissue's repeats</text>
  <path d="M292 186 L297 186" stroke="#b9b0cc" stroke-width="2"/>
