  <circle cx="773.2" cy="192.8" r="4.5" fill="#D85A30" fill-opacity="0.8" stroke="none" stroke-width="1"/>
  <circle cx="773.3" cy="202.4" r="4.5" fill="#D85A30" fill-opacity="0.8" stroke="none" stroke-width="1"/>
  <circle cx="765.7" cy="130.4" r="4.5" fill="#D85A30" fill-opacity="0.8" stroke="none" stroke-width="1"/>
  <line x1="646" y1="207.2" x2="690" y2="207.2" stroke="#4A3D6B" stroke-width="2.4"/>
  <line x1="750" y1="200.0" x2="794" y2="200.0" stroke="#4A3D6B" stroke-width="2.4"/>
  <text x="668.0" y="252.0" font-size="10" fill="#555" text-anchor="middle">R (n = 6)</text>
  <text x="772.0" y="252.0" font-size="10" fill="#555" text-anchor="middle">NR (n = 6)</text>
  <text x="720.0" y="112.0" font-size="11.5" fill="#4A3D6B" font-weight="700" text-anchor="middle">Wilcoxon on patients: p = 0.31</text>
  <text x="608.0" y="270.0" font-size="11.5" fill="#666">median 12% vs 15%</text>
  <text x="608.0" y="296.0" font-size="11.5" fill="#666">One patient makes the whole story</text>
  <text x="608.0" y="312.0" font-size="11.5" fill="#0F6E56" font-weight="700">→ effect size + interval, more patients</text>
  <rect x="24" y="338" width="832" height="70" rx="8" fill="#fbf7ee" stroke="#e5d3b3" stroke-width="1.5"/>
  <text x="48.0" y="362.0" font-size="12.5" fill="#7a5f2a" font-weight="700">⚠️ Same logic as pseudobulk (W5 §5.3): the patient is the replicate; spots are repeated measurements of one tissue.</text>
  <text x="48.0" y="388.0" font-size="12.5" fill="#7a5f2a">💡 Niche fractions are compositional (W5 §5.4) → use propeller-style tests. More patients beat more spots.</text>
