<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="420" fill="#fcfcfb"/>
  <text x="24.0" y="28.0" font-size="15" fill="#4A3D6B" font-weight="700">Discovery finds candidates. Targeted MS with heavy standards turns one into a number a lab can report.</text>
  <rect x="24" y="46" width="266" height="280" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="42.0" y="72.0" font-size="13" fill="#4A3D6B" font-weight="700">① Three stages</text>
  <text x="42.0" y="90.0" font-size="10.5" fill="#8A7FA3">breadth traded for precision and n</text>
  <text x="144.0" y="108.0" font-size="10" fill="#534AB7" font-weight="700" text-anchor="end">proteins</text>
  <text x="156.0" y="108.0" font-size="10" fill="#185FA5" font-weight="700">samples</text>
  <line x1="150" y1="119" x2="150" y2="141" stroke="#cfc9dd" stroke-width="1.2"/>
  <rect x="78.0" y="122.0" width="70.0" height="16.0" rx="0" fill="#534AB7" fill-opacity="0.8"/>
  <rect x="152.0" y="122.0" width="8.4" height="16.0" rx="0" fill="#185FA5" fill-opacity="0.8"/>
  <text x="74.0" y="134.0" font-size="9.5" fill="#534AB7" text-anchor="end">~5,000</text>
  <text x="164.4" y="134.0" font-size="9.5" fill="#185FA5">tens</text>
  <text x="150.0" y="152.0" font-size="10" fill="#4A3D6B" font-weight="700" text-anchor="middle">Discovery · DIA / TMT</text>
  <line x1="150" y1="161" x2="150" y2="183" stroke="#cfc9dd" stroke-width="1.2"/>
  <rect x="125.6" y="164.0" width="22.4" height="16.0" rx="0" fill="#534AB7" fill-opacity="0.8"/>
  <rect x="152.0" y="164.0" width="31.5" height="16.0" rx="0" fill="#185FA5" fill-opacity="0.8"/>
  <text x="121.6" y="176.0" font-size="9.5" fill="#534AB7" text-anchor="end">10–100</text>
  <text x="187.5" y="176.0" font-size="9.5" fill="#185FA5">hundreds</text>
  <text x="150.0" y="194.0" font-size="10" fill="#4A3D6B" font-weight="700" text-anchor="middle">Verification · PRM / MRM</text>
  <line x1="150" y1="203" x2="150" y2="225" stroke="#cfc9dd" stroke-width="1.2"/>
  <rect x="143.8" y="206.0" width="4.2" height="16.0" rx="0" fill="#534AB7" fill-opacity="0.8"/>
  <rect x="152.0" y="206.0" width="70.0" height="16.0" rx="0" fill="#185FA5" fill-opacity="0.8"/>
  <text x="139.8" y="218.0" font-size="9.5" fill="#534AB7" text-anchor="end">1–few</text>
  <text x="226.0" y="218.0" font-size="9.5" fill="#185FA5">thousands</text>
  <text x="150.0" y="236.0" font-size="10" fill="#4A3D6B" font-weight="700" text-anchor="middle">Validation · clinical assay</text>
  <text x="42.0" y="296.0" font-size="11.5" fill="#666">Most candidates stop at stage 1–2</text>
  <text x="42.0" y="312.0" font-size="11.5" fill="#a8401d" font-weight="700">→ each stage needs a new cohort</text>
  <path d="M292 186 L297 186" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M305 186 l-9 -5 v10 z" fill="#b9b0cc"/>
  <rect x="307" y="46" width="266" height="280" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="325.0" y="72.0" font-size="13" fill="#4A3D6B" font-weight="700">② Heavy-isotope standard</text>
  <text x="325.0" y="90.0" font-size="10.5" fill="#8A7FA3">a known amount of the same peptide</text>
  <line x1="330" y1="220" x2="552" y2="220" stroke="#cfc9dd" stroke-width="1.2"/>
  <path d="M373.0 219.9 L374.1 219.9 L375.3 219.8 L376.4 219.5 L377.5 219.2 L378.6 218.6 L379.8 217.6 L380.9 216.2 L382.0 214.1 L383.2 211.1 L384.3 207.2 L385.4 202.3 L386.5 196.3 L387.7 189.4 L388.8 182.0 L389.9 174.4 L391.1 167.2 L392.2 161.1 L393.3 156.6 L394.4 154.3 L395.6 154.3 L396.7 156.6 L397.8 161.1 L398.9 167.2 L400.1 174.4 L401.2 182.0 L402.3 189.4 L403.5 196.3 L404.6 202.3 L405.7 207.2 L406.8 211.1 L408.0 214.1 L409.1 216.2 L410.2 217.6 L411.4 218.6 L412.5 219.2 L413.6 219.5 L414.7 219.8 L415.9 219.9 L417.0 219.9" fill="#185FA5" fill-opacity="0.35" stroke="#185FA5" stroke-width="1.8"/>
  <path d="M448.0 219.9 L449.1 219.8 L450.3 219.6 L451.4 219.2 L452.5 218.6 L453.6 217.6 L454.8 216.0 L455.9 213.6 L457.0 210.1 L458.2 205.2 L459.3 198.7 L460.4 190.5 L461.5 180.5 L462.7 169.0 L463.8 156.6 L464.9 143.9 L466.1 132.0 L467.2 121.8 L468.3 114.4 L469.4 110.5 L470.6 110.5 L471.7 114.4 L472.8 121.8 L473.9 132.0 L475.1 143.9 L476.2 156.6 L477.3 169.0 L478.5 180.5 L479.6 190.5 L480.7 198.7 L481.8 205.2 L483.0 210.1 L484.1 213.6 L485.2 216.0 L486.4 217.6 L487.5 218.6 L488.6 219.2 L489.7 219.6 L490.9 219.8 L492.0 219.9" fill="#534AB7" fill-opacity="0.12" stroke="#534AB7" stroke-width="1.8" stroke-dasharray="4 2"/>
  <text x="370.0" y="176.0" font-size="10.5" fill="#185FA5" font-weight="700" text-anchor="end">light</text>
  <text x="370.0" y="190.0" font-size="9.5" fill="#555" text-anchor="end">from the patient</text>
  <text x="496.0" y="132.0" font-size="10.5" fill="#534AB7" font-weight="700">heavy</text>
  <text x="496.0" y="146.0" font-size="9.5" fill="#555">spiked: 50 fmol</text>
  <path d="M405 232 H460" stroke="#b9b0cc" stroke-width="1.2"/>
  <text x="432.0" y="246.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">same peptide, +8 Da</text>
  <text x="552.0" y="234.0" font-size="9.5" fill="#8A7FA3" text-anchor="end">m/z</text>
  <text x="440.0" y="270.0" font-size="11.5" fill="#4A3D6B" font-weight="700" text-anchor="middle">0.6 × 50 fmol = 30 fmol</text>
  <text x="325.0" y="296.0" font-size="11.5" fill="#666">Ratio × known amount</text>
  <text x="325.0" y="312.0" font-size="11.5" fill="#4A3D6B" font-weight="700">→ an absolute concentration</text>
  <path d="M575 186 L580 186" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M588 186 l-9 -5 v10 z" fill="#b9b0cc"/>
  <rect x="590" y="46" width="266" height="280" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="608.0" y="72.0" font-size="13" fill="#4A3D6B" font-weight="700">③ Why a lab bothers</text>
  <text x="608.0" y="90.0" font-size="10.5" fill="#8A7FA3">thyroglobulin with anti-Tg antibodies</text>
  <line x1="620" y1="226" x2="836" y2="226" stroke="#cfc9dd" stroke-width="1.2"/>
  <rect x="650.0" y="212.0" width="60.0" height="14.0" rx="3" fill="#8A7FA3" fill-opacity="0.6"/>
  <rect x="746.0" y="134.0" width="60.0" height="92.0" rx="3" fill="#0F6E56" fill-opacity="0.8"/>
  <text x="680.0" y="205.0" font-size="10.5" fill="#a8401d" font-weight="700" text-anchor="middle">falsely low</text>
  <text x="776.0" y="128.0" font-size="10.5" fill="#0F6E56" font-weight="700" text-anchor="middle">detected</text>
  <text x="680.0" y="242.0" font-size="10.5" fill="#555" text-anchor="middle">immunoassay</text>
  <text x="776.0" y="242.0" font-size="10.5" fill="#555" text-anchor="middle">LC-MS/MS</text>
  <text x="723.0" y="112.0" font-size="9.5" fill="#8A7FA3" text-anchor="middle">serum Tg, same patient (illustrative)</text>
  <text x="608.0" y="270.0" font-size="11.5" fill="#666">Autoantibodies block the immunoassay;</text>
  <text x="608.0" y="296.0" font-size="11.5" fill="#666">digestion removes them before</text>
  <text x="608.0" y="312.0" font-size="11.5" fill="#0F6E56" font-weight="700">the peptide is weighed</text>
  <rect x="24" y="338" width="832" height="70" rx="8" fill="#fbf7ee" stroke="#e5d3b3" stroke-width="1.5"/>
  <text x="48.0" y="362.0" font-size="12.5" fill="#7a5f2a" font-weight="700">⚠️ A discovery hit is a candidate, not a test — each stage needs a new, larger, independent cohort (W10 §3).</text>
  <text x="48.0" y="388.0" font-size="12.5" fill="#7a5f2a">💡 Your hospital lab already runs LC-MS/MS: thyroglobulin, steroid hormones, vitamin D, drug monitoring.</text>
</svg>
