<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A7FA3"/></marker></defs>
<rect x="0" y="0" width="880" height="370" fill="#fcfcfb"/>
<text x="24" y="28" font-size="15" fill="#4A3D6B" font-weight="700">Six questions between "my gene came out on top" and "this is a drug target".</text>
<rect x="24" y="50" width="258" height="34" rx="8" fill="#f3f2fb"/>
<text x="153" y="72" font-size="13.5" fill="#7068C8" font-weight="700" text-anchor="middle">Is it causal?</text>
<line x1="287" y1="67" x2="306" y2="67" stroke="#8A7FA3" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="24" y="96" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="48" cy="121" r="11.5" fill="#7068C8"/>
<text x="48" y="125.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="126" font-size="13" fill="#4A3D6B" font-weight="700">Does human genetics</text>
<text x="70" y="143.5" font-size="13" fill="#4A3D6B" font-weight="700">support it?</text>
<text x="70" y="168" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">MR, coding variant (W3)</tspan></text>
<rect x="24" y="214" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="48" cy="239" r="11.5" fill="#7068C8"/>
<text x="48" y="243.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="244" font-size="13" fill="#4A3D6B" font-weight="700">Which direction,</text>
<text x="70" y="261.5" font-size="13" fill="#4A3D6B" font-weight="700">and in which cell?</text>
<text x="70" y="286" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">MR direction,</tspan></text>
<text x="70" y="301.5" font-size="11.5" fill="#8A7FA3">QTL in the disease tissue (§2.1)</text>
<rect x="311" y="50" width="258" height="34" rx="8" fill="#ecebf8"/>
<text x="440" y="72" font-size="13.5" fill="#534AB7" font-weight="700" text-anchor="middle">Can a drug act on it?</text>
<line x1="574" y1="67" x2="593" y2="67" stroke="#8A7FA3" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="311" y="96" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="335" cy="121" r="11.5" fill="#534AB7"/>
<text x="335" y="125.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="357" y="126" font-size="13" fill="#4A3D6B" font-weight="700">Is it expressed</text>
<text x="357" y="143.5" font-size="13" fill="#4A3D6B" font-weight="700">where you need it?</text>
<text x="357" y="168" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">cell type and tissue (W5, W7)</tspan></text>
<rect x="311" y="214" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="335" cy="239" r="11.5" fill="#534AB7"/>
<text x="335" y="243.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="357" y="244" font-size="13" fill="#4A3D6B" font-weight="700">Is it tractable?</text>
<text x="357" y="286" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">small molecule or antibody</tspan></text>
<text x="357" y="301.5" font-size="11.5" fill="#8A7FA3">(Open Targets)</text>
<rect x="598" y="50" width="258" height="34" rx="8" fill="#e5e3f4"/>
<text x="727" y="72" font-size="13.5" fill="#3A3288" font-weight="700" text-anchor="middle">Is it worth it?</text>
<rect x="598" y="96" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="622" cy="121" r="11.5" fill="#3A3288"/>
<text x="622" y="125.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="644" y="126" font-size="13" fill="#4A3D6B" font-weight="700">What else does it do?</text>
<text x="644" y="168" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">loss-of-function carriers,</tspan></text>
<text x="644" y="183.5" font-size="11.5" fill="#8A7FA3">PheWAS (gnomAD)</text>
<rect x="598" y="214" width="258" height="104" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.3"/>
<circle cx="622" cy="239" r="11.5" fill="#3A3288"/>
<text x="622" y="243.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="644" y="244" font-size="13" fill="#4A3D6B" font-weight="700">Would it change management?</text>
<text x="644" y="286" font-size="11.5"><tspan fill="#8A7FA3" font-weight="700">check: </tspan><tspan fill="#8A7FA3">your patients and current care</tspan></text>
<text x="644" y="301.5" font-size="11.5" fill="#8A7FA3">(only you can answer)</text>
<text x="24" y="350" font-size="13" fill="#4A3D6B" font-weight="700">Answering all six for one gene is a complete piece of work, even if the answer to ⑥ is "no".</text>
</svg>
