<text x="52" y="76" font-size="11.5" fill="#8A7FA3" font-weight="700">target and exposure</text>
<text x="388" y="76" font-size="11.5" fill="#8A7FA3" font-weight="700" text-anchor="middle">odds ratio (log scale)</text>
