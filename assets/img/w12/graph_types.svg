<text x="44" y="385" font-size="13" fill="#a8401d" font-weight="700">⚠️ Drop the direction or the sign and a conclusion can flip:</text>
<text x="44" y="405" font-size="13" fill="#a8401d" font-weight="700">read an inhibitory edge as activating and the pathway runs backwards.</text>
