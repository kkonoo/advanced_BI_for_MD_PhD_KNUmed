<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434" width="880" height="434" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A7FA3"/></marker></defs>
<rect x="0" y="0" width="880" height="434" fill="#fcfcfb"/>
<text x="24" y="28" font-size="15" fill="#4A3D6B" font-weight="700">What an edge carries decides the type of graph.</text>
<rect x="24" y="46" width="158" height="304" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="38" y="72" font-size="13.5" fill="#4A3D6B" font-weight="700">① Undirected</text>
<text x="38" y="218" font-size="11" fill="#8A7FA3" font-weight="700">edge carries</text>
<text x="38" y="235" font-size="11.5" fill="#5B4D80">only that A and B</text>
<text x="38" y="250" font-size="11.5" fill="#5B4D80">are linked</text>
<text x="38" y="265" font-size="11.5" fill="#5B4D80">(A–B is the same as B–A)</text>
<text x="38" y="288" font-size="11" fill="#8A7FA3" font-weight="700">e.g.</text>
<text x="38" y="305" font-size="11.5" fill="#5B4D80">PPI: two proteins bind</text>
<line x1="38" y1="198" x2="168" y2="198" stroke="#eee9f3" stroke-width="1.2"/>
<rect x="192.5" y="46" width="158" height="304" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="206.5" y="72" font-size="13.5" fill="#4A3D6B" font-weight="700">② Directed</text>
<text x="206.5" y="218" font-size="11" fill="#8A7FA3" font-weight="700">edge carries</text>
<text x="206.5" y="235" font-size="11.5" fill="#5B4D80">a direction, so A → B</text>
<text x="206.5" y="250" font-size="11.5" fill="#5B4D80">is not B → A</text>
<text x="206.5" y="288" font-size="11" fill="#8A7FA3" font-weight="700">e.g.</text>
<text x="206.5" y="305" font-size="11.5" fill="#5B4D80">transcription factor →</text>
<text x="206.5" y="320" font-size="11.5" fill="#5B4D80">target gene;</text>
<text x="206.5" y="335" font-size="11.5" fill="#5B4D80">kinase → substrate</text>
<line x1="206.5" y1="198" x2="336.5" y2="198" stroke="#eee9f3" stroke-width="1.2"/>
<rect x="361" y="46" width="158" height="304" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="375" y="72" font-size="13.5" fill="#4A3D6B" font-weight="700">③ Weighted</text>
<text x="375" y="218" font-size="11" fill="#8A7FA3" font-weight="700">edge carries</text>
<text x="375" y="235" font-size="11.5" fill="#5B4D80">a number (strength,</text>
<text x="375" y="250" font-size="11.5" fill="#5B4D80">confidence)</text>
<text x="375" y="288" font-size="11" fill="#8A7FA3" font-weight="700">e.g.</text>
<text x="375" y="305" font-size="11.5" fill="#5B4D80">STRING score,</text>
<text x="375" y="320" font-size="11.5" fill="#5B4D80">correlation</text>
<line x1="375" y1="198" x2="505" y2="198" stroke="#eee9f3" stroke-width="1.2"/>
<rect x="529.5" y="46" width="158" height="304" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="543.5" y="72" font-size="13.5" fill="#4A3D6B" font-weight="700">④ Signed</text>
<text x="543.5" y="218" font-size="11" fill="#8A7FA3" font-weight="700">edge carries</text>
<text x="543.5" y="235" font-size="11.5" fill="#5B4D80">+ or −</text>
<text x="543.5" y="288" font-size="11" fill="#8A7FA3" font-weight="700">e.g.</text>
<text x="543.5" y="305" font-size="11.5" fill="#5B4D80">activation vs inhibition</text>
<text x="543.5" y="320" font-size="11.5" fill="#5B4D80">in signalling</text>
<line x1="543.5" y1="198" x2="673.5" y2="198" stroke="#eee9f3" stroke-width="1.2"/>
<rect x="698" y="46" width="158" height="304" rx="10" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
<text x="712" y="72" font-size="13.5" fill="#4A3D6B" font-weight="700">⑤ Bipartite</text>
<text x="712" y="218" font-size="11" fill="#8A7FA3" font-weight="700">edge carries</text>
<text x="712" y="235" font-size="11.5" fill="#5B4D80">links between two</text>
<text x="712" y="250" font-size="11.5" fill="#5B4D80">kinds of node</text>
<text x="712" y="288" font-size="11" fill="#8A7FA3" font-weight="700">e.g.</text>
<text x="712" y="305" font-size="11.5" fill="#5B4D80">drug–target,</text>
<text x="712" y="320" font-size="11.5" fill="#5B4D80">gene–pathway,</text>
<text x="712" y="335" font-size="11.5" fill="#5B4D80">patient–diagnosis</text>
<line x1="712" y1="198" x2="842" y2="198" stroke="#eee9f3" stroke-width="1.2"/>
