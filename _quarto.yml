project:
  type: website
  execute-dir: project
  output-dir: _site
  resources:
    - assets/img/**

  # 렌더 대상을 명시 — 이 목록에 없는 .qmd 는 빌드하지 않음
  # (examples/ 는 이전 학기 자료라 제외)
  render:
    - index.qmd
    - chapters/part1/w1_intro.qmd
    - chapters/part1/w2_scripts_ai.qmd
    - chapters/part2/w3_gwas.qmd
    - chapters/part2/w4_prs.qmd
    - chapters/part3/w5_scrna_qc.qmd
    - chapters/part3/w6_scrna_dynamics.qmd
    - chapters/part4/w7_spatial_basics.qmd
    - chapters/part4/w8_spatial_integration.qmd
    - chapters/part5/w9_proteomics_tech.qmd
    - chapters/part5/w10_clinical_proteomics.qmd
    - chapters/part6/w11_multiomics.qmd
    - chapters/part6/w12_network_drug.qmd
    - chapters/part7/w13_visualization.qmd
    - chapters/part7/w14_project_design.qmd


