    contents:
      - text: "Home"
        href: index.qmd
      - section: "1 · Intro"
        contents:
          - href: chapters/part1/w1_intro.qmd
            text: "W1. Introduction & Roadmap"
          - href: chapters/part1/w2_scripts_ai.qmd
            text: "W2. Scripts, AI & Reproducibility"
