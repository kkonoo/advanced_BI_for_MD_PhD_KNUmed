format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false
    code-copy: true
    highlight-style: github

    number-sections: false
    smooth-scroll: true

    grid:
      sidebar-width: 300px
      body-width: 1000px
      margin-width: 280px # toc

    # AI 채팅 위젯 전역 설정
    include-after-body:
      - assets/site-ui.html
      - assets/ai-chat-init.html


execute:
  freeze: auto          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: false
  warning: false
  message: false
