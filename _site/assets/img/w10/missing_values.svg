<rect x="96" y="88" width="99" height="168" fill="#D85A30" fill-opacity="0.10"/>
<line x1="195" y1="88" x2="195" y2="256" stroke="#D85A30" stroke-width="2" stroke-dasharray="5 4"/>
<text x="146" y="172" font-size="11.5" font-weight="700" fill="#a8401d" text-anchor="middle">not detected</text>
<text x="146" y="188" font-size="11.5" font-weight="700" fill="#a8401d" text-anchor="middle">= NA</text>
<text x="203" y="104" font-size="11" fill="#8A7FA3">limit of detection</text>
<line x1="96" y1="256" x2="426" y2="256" stroke="#cfc9dd" stroke-width="1.2"/>
<text x="261" y="280" font-size="11.5" fill="#8A7FA3" text-anchor="middle">protein intensity (log)</text>
<text x="422" y="104" font-size="11.5" fill="#8A7FA3" text-anchor="end">— — true distribution</text>
<text x="48" y="312" font-size="12" fill="#666">The missing values are <tspan font-weight="700" fill="#4A3D6B">the left tail</tspan>. That is information,</text>
<text x="48" y="330" font-size="12" fill="#666">not absence of information.</text>
<rect x="484" y="46" width="372" height="300" rx="10" fill="#ffffff" stroke="#D85A30" stroke-width="2"/>
<text x="508" y="72" font-size="13.5" font-weight="700" fill="#a8401d">⚠️ Four common choices, four answers</text>
<rect x="508" y="90" width="4" height="52" rx="2" fill="#D85A30"/>
<text x="524" y="104" font-size="12.5" font-weight="700" fill="#4A3D6B">Drop proteins with any NA</text>
<text x="524" y="122" font-size="11.5" fill="#666">Keeps only abundant proteins. Your candidate</text>
<text x="524" y="138" font-size="11.5" fill="#666">biomarker is exactly the kind you deleted.</text>
<rect x="508" y="152" width="4" height="52" rx="2" fill="#D85A30"/>
<text x="524" y="166" font-size="12.5" font-weight="700" fill="#4A3D6B">Impute with the mean</text>
<text x="524" y="184" font-size="11.5" fill="#666">Pulls low values up toward the middle. Kills the</text>
<text x="524" y="200" font-size="11.5" fill="#666">very difference you are testing for.</text>
<rect x="508" y="214" width="4" height="52" rx="2" fill="#BA7517"/>
<text x="524" y="228" font-size="12.5" font-weight="700" fill="#4A3D6B">Impute from a low distribution</text>
<text x="524" y="246" font-size="11.5" fill="#666">Assumes MNAR — usually right for proteomics,</text>
<text x="524" y="262" font-size="11.5" fill="#666">and it is still an assumption you must state.</text>
<rect x="508" y="276" width="4" height="52" rx="2" fill="#1D9E75"/>
<text x="524" y="290" font-size="12.5" font-weight="700" fill="#4A3D6B">Model missingness explicitly</text>
<text x="524" y="308" font-size="11.5" fill="#666">MSstats, or a presence/absence test alongside</text>
<text x="524" y="324" font-size="11.5" fill="#666">the intensity test. ✅ the defensible option.</text>
<text x="24" y="376" font-size="12.5" fill="#666">⚠️ Ask any proteomics paper: how many values were missing, and what was done with them? Both numbers change the results.</text>
<text x="24" y="398" font-size="12.5" font-weight="700" fill="#4A3D6B">💡 A useful sanity check: rerun the analysis with a different imputation and see whether your hit survives.</text>
</svg>