<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="470" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">One claim, five kinds of evidence. Know which rung you are standing on.</text>

  <!-- claim -->
  <rect x="24" y="44" width="832" height="42" rx="8" fill="#f3f0f7" stroke="#5B4D80" stroke-width="1.5"/>
  <text x="48" y="70" font-size="13.5" fill="#555">The claim: <tspan font-weight="700" fill="#4A3D6B">"Macrophage-derived TGF-β drives fibroblast activation at the invasion front."</tspan></text>

  <!-- rungs -->
  <g>
    <rect x="24" y="100" width="832" height="56" rx="8" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
    <rect x="24" y="100" width="6" height="56" rx="3" fill="#c9c2d8"/>
    <text x="52" y="124" font-size="13" font-weight="700" fill="#4A3D6B">① scRNA-seq — the cell types exist</text>
    <text x="52" y="144" font-size="12" fill="#666">Macrophages express <tspan font-family="monospace" font-size="11.5">TGFB1</tspan>; fibroblasts express its receptor and an activation programme.</text>
    <rect x="700" y="114" width="140" height="28" rx="14" fill="#eeeaf4"/>
    <text x="770" y="133" font-size="12" font-weight="700" fill="#5B4D80" text-anchor="middle">description</text>

    <rect x="24" y="166" width="832" height="56" rx="8" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
    <rect x="24" y="166" width="6" height="56" rx="3" fill="#D85A30"/>
    <text x="52" y="190" font-size="13" font-weight="700" fill="#4A3D6B">② Ligand–receptor inference — a nomination</text>
    <text x="52" y="210" font-size="12" fill="#666">⚠️ Co-expression only. The cells may never have met, and the protein may never have been made (W6 §3).</text>
    <rect x="700" y="180" width="140" height="28" rx="14" fill="#fbeee8"/>
    <text x="770" y="199" font-size="12" font-weight="700" fill="#a8401d" text-anchor="middle">hypothesis</text>

    <rect x="24" y="232" width="832" height="56" rx="8" fill="#ffffff" stroke="#BA7517" stroke-width="1.8"/>
    <rect x="24" y="232" width="6" height="56" rx="3" fill="#BA7517"/>
    <text x="52" y="256" font-size="13" font-weight="700" fill="#4A3D6B">③ Spatial + deconvolution — they are actually neighbours</text>
    <text x="52" y="276" font-size="12" fill="#666">✅ The two cell types co-occur in the same niche, and activated fibroblasts are enriched exactly there.</text>
    <rect x="700" y="246" width="140" height="28" rx="14" fill="#f8f1e6"/>
    <text x="770" y="265" font-size="12" font-weight="700" fill="#8a6a1f" text-anchor="middle">consistent with</text>

    <rect x="24" y="298" width="832" height="56" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="1.8"/>
    <rect x="24" y="298" width="6" height="56" rx="3" fill="#1D9E75"/>
    <text x="52" y="322" font-size="13" font-weight="700" fill="#4A3D6B">④ Protein in situ — the molecule is present where it should be</text>
    <text x="52" y="342" font-size="12" fill="#666">✅ Immunofluorescence shows the protein, and phospho-SMAD2 in the adjacent fibroblasts (W9–W10).</text>
    <rect x="700" y="312" width="140" height="28" rx="14" fill="#e8f5f0"/>
    <text x="770" y="331" font-size="12" font-weight="700" fill="#0F6E56" text-anchor="middle">supported</text>

    <rect x="24" y="364" width="832" height="56" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
    <rect x="24" y="364" width="6" height="56" rx="3" fill="#185FA5"/>
    <text x="52" y="388" font-size="13" font-weight="700" fill="#4A3D6B">⑤ Perturbation — blocking it changes the outcome</text>
    <text x="52" y="408" font-size="12" fill="#666">✅ Receptor blockade or co-culture abolishes the activation programme. Only now is "drives" the right verb.</text>
    <rect x="700" y="378" width="140" height="28" rx="14" fill="#eaf1f8"/>
    <text x="770" y="397" font-size="12" font-weight="700" fill="#185FA5" text-anchor="middle">demonstrated</text>
  </g>

  <text x="24" y="446" font-size="12.5" fill="#666">💡 Most published omics papers stop at ② or ③ and write the verb from ⑤. Your capstone (W14) does not have to reach ⑤ —</text>
  <text x="24" y="464" font-size="12.5" font-weight="700" fill="#4A3D6B">it has to name the rung it reached, and specify the next one.</text>
</svg>
