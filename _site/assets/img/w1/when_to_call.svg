<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="400" fill="#fcfcfb"/>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">When you involve an analyst decides what is still fixable.</text>

  <!-- GOOD box (top left) -->
  <rect x="40" y="48" width="368" height="66" rx="8" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="62" y="72" font-size="13.5" font-weight="700" fill="#0F6E56">✅ Call an analyst here</text>
  <text x="62" y="94" font-size="12.5" fill="#3d7a68">Everything is still a choice: n, sample type, controls, batching.</text>
  <path d="M190 114 L190 178" stroke="#1D9E75" stroke-width="2"/>
  <path d="M190 184 l-5 -8 h10 z" fill="#1D9E75"/>

  <!-- BAD box (top right) -->
  <rect x="472" y="48" width="368" height="66" rx="8" fill="#fbeee8" stroke="#D85A30" stroke-width="1.5"/>
  <text x="494" y="72" font-size="13.5" font-weight="700" fill="#a8401d">❌ Most people call here instead</text>
  <text x="494" y="94" font-size="12.5" fill="#a05a3f">Nothing above is a choice any more — only a post-mortem.</text>
  <path d="M750 114 L750 178" stroke="#D85A30" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M750 184 l-5 -8 h10 z" fill="#D85A30"/>

  <!-- timeline bar -->
  <rect x="40" y="190" width="800" height="8" rx="4" fill="#e6e1ee"/>

  <!-- stage ticks -->
  <g text-anchor="middle">
    <circle cx="110" cy="194" r="9" fill="#1D9E75"/>
    <text x="110" y="228" font-size="13" font-weight="700" fill="#4A3D6B">Idea</text>
    <text x="110" y="245" font-size="11.5" fill="#8A7FA3">the question</text>

    <circle cx="270" cy="194" r="9" fill="#1D9E75"/>
    <text x="270" y="228" font-size="13" font-weight="700" fill="#4A3D6B">Design</text>
    <text x="270" y="245" font-size="11.5" fill="#8A7FA3">n, groups, controls</text>

    <circle cx="430" cy="194" r="9" fill="#BA7517"/>
    <text x="430" y="228" font-size="13" font-weight="700" fill="#4A3D6B">Collection</text>
    <text x="430" y="245" font-size="11.5" fill="#8A7FA3">consent, storage</text>

    <circle cx="590" cy="194" r="9" fill="#D85A30"/>
    <text x="590" y="228" font-size="13" font-weight="700" fill="#4A3D6B">Sequencing</text>
    <text x="590" y="245" font-size="11.5" fill="#8A7FA3">batches, runs</text>

    <circle cx="750" cy="194" r="9" fill="#8A7FA3"/>
    <text x="750" y="228" font-size="13" font-weight="700" fill="#4A3D6B">Analysis</text>
    <text x="750" y="245" font-size="11.5" fill="#8A7FA3">"here is the data"</text>
  </g>

  <!-- what becomes permanent -->
  <rect x="40" y="266" width="800" height="76" rx="8" fill="#ffffff" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="62" y="290" font-size="12.5" font-weight="700" fill="#5B4D80">What each step locks in permanently</text>
  <g font-size="12.5" fill="#666">
    <text x="62" y="312">Design <tspan fill="#8A7FA3">→</tspan> your true n, and whether the comparison is possible at all</text>
    <text x="62" y="332">Collection <tspan fill="#8A7FA3">→</tspan> fresh or frozen, which fixes scRNA-seq vs snRNA-seq for good (W5)</text>
  </g>
  <text x="818" y="312" font-size="12.5" font-weight="700" fill="#a8401d" text-anchor="end">unrecoverable</text>
  <text x="818" y="332" font-size="12.5" font-weight="700" fill="#a8401d" text-anchor="end">unrecoverable</text>

  <!-- footer note -->
  <rect x="40" y="352" width="800" height="36" rx="8" fill="#fbf7ee" stroke="#e5d3b3" stroke-width="1.5"/>
  <text x="62" y="375" font-size="13" fill="#7a5f2a">⚠️ "Can you analyse this for me?" arriving after sequencing is the most expensive sentence in translational research.</text>
</svg>
