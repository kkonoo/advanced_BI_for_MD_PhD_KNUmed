<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="470" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">Where to spend a resident's very limited research time.</text>

  <!-- axes -->
  <line x1="150" y1="392" x2="700" y2="392" stroke="#cfc9dd" stroke-width="1.4"/>
  <line x1="150" y1="60" x2="150" y2="392" stroke="#cfc9dd" stroke-width="1.4"/>
  <text x="425" y="422" font-size="12.5" fill="#8A7FA3" text-anchor="middle">feasibility — can you get the data this year?  ➝</text>
  <text x="72" y="226" font-size="12.5" fill="#8A7FA3" text-anchor="middle" transform="rotate(-90 72 226)">clinical value  ➝</text>
  <line x1="425" y1="60" x2="425" y2="392" stroke="#eeeaf4" stroke-width="1"/>
  <line x1="150" y1="226" x2="700" y2="226" stroke="#eeeaf4" stroke-width="1"/>

  <!-- quadrant labels -->
  <rect x="160" y="70" width="250" height="146" rx="8" fill="#fbf7ee" fill-opacity="0.6"/>
  <text x="176" y="94" font-size="12.5" font-weight="700" fill="#8a6a1f">⚠️ Worth it, but not now</text>
  <text x="176" y="116" font-size="11.5" fill="#7a5f2a">Prospective cohort, new consent,</text>
  <text x="176" y="134" font-size="11.5" fill="#7a5f2a">fresh tissue, a new platform.</text>
  <text x="176" y="158" font-size="11.5" font-weight="700" fill="#8a6a1f">→ write it as the grant, not</text>
  <text x="176" y="176" font-size="11.5" font-weight="700" fill="#8a6a1f">as the capstone.</text>

  <rect x="440" y="70" width="250" height="146" rx="8" fill="#e8f5f0" fill-opacity="0.7"/>
  <text x="456" y="94" font-size="12.5" font-weight="700" fill="#0F6E56">✅ Start here</text>
  <text x="456" y="116" font-size="11.5" fill="#3d7a68">Archived FFPE with outcomes.</text>
  <text x="456" y="134" font-size="11.5" fill="#3d7a68">Public data answering a question</text>
  <text x="456" y="152" font-size="11.5" fill="#3d7a68">nobody asked of it.</text>
  <text x="456" y="176" font-size="11.5" font-weight="700" fill="#0F6E56">→ this is your capstone.</text>

  <rect x="160" y="236" width="250" height="146" rx="8" fill="#fbeee8" fill-opacity="0.6"/>
  <text x="176" y="260" font-size="12.5" font-weight="700" fill="#a8401d">❌ Neither</text>
  <text x="176" y="282" font-size="11.5" fill="#a05a3f">"Profile everything and see</text>
  <text x="176" y="300" font-size="11.5" fill="#a05a3f">what comes out."</text>
  <text x="176" y="324" font-size="11.5" font-weight="700" fill="#a8401d">→ this is where most first</text>
  <text x="176" y="342" font-size="11.5" font-weight="700" fill="#a8401d">projects quietly die.</text>

  <rect x="440" y="236" width="250" height="146" rx="8" fill="#f3f0f7" fill-opacity="0.7"/>
  <text x="456" y="260" font-size="12.5" font-weight="700" fill="#5B4D80">⚠️ Easy, but so what?</text>
  <text x="456" y="282" font-size="11.5" fill="#6d6088">Re-analysing a public dataset the</text>
  <text x="456" y="300" font-size="11.5" fill="#6d6088">way it was already analysed.</text>
  <text x="456" y="324" font-size="11.5" font-weight="700" fill="#5B4D80">→ fine as practice. Not a</text>
  <text x="456" y="342" font-size="11.5" font-weight="700" fill="#5B4D80">project.</text>

  <!-- footer -->
  <rect x="24" y="434" width="832" height="0" fill="none"/>
  <text x="24" y="448" font-size="12.5" fill="#666">💡 The top-right quadrant is bigger than most residents think — because "data you already own" includes the pathology archive, the</text>
  <text x="24" y="464" font-size="12.5" fill="#666">EHR, and every public dataset that was collected to answer a <tspan font-weight="700" fill="#4A3D6B">different</tspan> question than the one you have.</text>
</svg>
