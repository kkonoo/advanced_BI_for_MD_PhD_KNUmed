<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="470" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">Integration, in the form you will actually use it: narrowing a locus to one gene.</text>

  <!-- header row -->
  <text x="48" y="72" font-size="12" font-weight="700" fill="#8A7FA3">gene</text>
  <text x="228" y="66" font-size="11.5" font-weight="700" fill="#185FA5" text-anchor="middle">eQTL</text>
  <text x="228" y="80" font-size="10.5" fill="#8A7FA3" text-anchor="middle">coloc</text>
  <text x="348" y="66" font-size="11.5" font-weight="700" fill="#BA7517" text-anchor="middle">cell type</text>
  <text x="348" y="80" font-size="10.5" fill="#8A7FA3" text-anchor="middle">scRNA</text>
  <text x="468" y="66" font-size="11.5" font-weight="700" fill="#1D9E75" text-anchor="middle">protein</text>
  <text x="468" y="80" font-size="10.5" fill="#8A7FA3" text-anchor="middle">pQTL / MS</text>
  <text x="588" y="66" font-size="11.5" font-weight="700" fill="#534AB7" text-anchor="middle">direction</text>
  <text x="588" y="80" font-size="10.5" fill="#8A7FA3" text-anchor="middle">MR</text>
  <text x="708" y="66" font-size="11.5" font-weight="700" fill="#D85A30" text-anchor="middle">tractable</text>
  <text x="708" y="80" font-size="10.5" fill="#8A7FA3" text-anchor="middle">druggability</text>
  <line x1="40" y1="88" x2="856" y2="88" stroke="#d8d2e4" stroke-width="1.2"/>

  <!-- rows -->
  <g font-size="12.5">
    <text x="48" y="116" font-style="italic" fill="#555">FAM<tspan font-size="10">…</tspan>21</text>
    <text x="228" y="116" text-anchor="middle" fill="#c9c2d8">✕</text><text x="348" y="116" text-anchor="middle" fill="#c9c2d8">✕</text><text x="468" y="116" text-anchor="middle" fill="#c9c2d8">✕</text><text x="588" y="116" text-anchor="middle" fill="#c9c2d8">✕</text><text x="708" y="116" text-anchor="middle" fill="#c9c2d8">✕</text>
    <text x="796" y="116" font-size="11" fill="#b3aac4">nearest gene</text>

    <text x="48" y="150" font-style="italic" fill="#555">CCR2</text>
    <text x="228" y="150" text-anchor="middle" fill="#185FA5" font-weight="700">✓</text><text x="348" y="150" text-anchor="middle" fill="#c9c2d8">✕</text><text x="468" y="150" text-anchor="middle" fill="#c9c2d8">✕</text><text x="588" y="150" text-anchor="middle" fill="#c9c2d8">✕</text><text x="708" y="150" text-anchor="middle" fill="#D85A30" font-weight="700">✓</text>

    <text x="48" y="184" font-style="italic" fill="#555">TNFAIP3</text>
    <text x="228" y="184" text-anchor="middle" fill="#185FA5" font-weight="700">✓</text><text x="348" y="184" text-anchor="middle" fill="#BA7517" font-weight="700">✓</text><text x="468" y="184" text-anchor="middle" fill="#c9c2d8">✕</text><text x="588" y="184" text-anchor="middle" fill="#c9c2d8">✕</text><text x="708" y="184" text-anchor="middle" fill="#c9c2d8">✕</text>

    <text x="48" y="218" font-style="italic" fill="#555">IL6R</text>
    <text x="228" y="218" text-anchor="middle" fill="#185FA5" font-weight="700">✓</text><text x="348" y="218" text-anchor="middle" fill="#BA7517" font-weight="700">✓</text><text x="468" y="218" text-anchor="middle" fill="#1D9E75" font-weight="700">✓</text><text x="588" y="218" text-anchor="middle" fill="#534AB7" font-weight="700">✓</text><text x="708" y="218" text-anchor="middle" fill="#D85A30" font-weight="700">✓</text>
    <rect x="40" y="200" width="740" height="26" rx="5" fill="#1D9E75" fill-opacity="0.10"/>
    <text x="796" y="218" font-size="11" font-weight="700" fill="#0F6E56">all five ✅</text>

    <text x="48" y="252" font-style="italic" fill="#555">ATP6V0A1</text>
    <text x="228" y="252" text-anchor="middle" fill="#c9c2d8">✕</text><text x="348" y="252" text-anchor="middle" fill="#BA7517" font-weight="700">✓</text><text x="468" y="252" text-anchor="middle" fill="#c9c2d8">✕</text><text x="588" y="252" text-anchor="middle" fill="#c9c2d8">✕</text><text x="708" y="252" text-anchor="middle" fill="#c9c2d8">✕</text>

    <text x="48" y="286" font-style="italic" fill="#555">LINC01<tspan font-size="10">…</tspan></text>
    <text x="228" y="286" text-anchor="middle" fill="#185FA5" font-weight="700">✓</text><text x="348" y="286" text-anchor="middle" fill="#c9c2d8">✕</text><text x="468" y="286" text-anchor="middle" fill="#8A7FA3">—</text><text x="588" y="286" text-anchor="middle" fill="#8A7FA3">—</text><text x="708" y="286" text-anchor="middle" fill="#c9c2d8">✕</text>
    <text x="796" y="286" font-size="11" fill="#a08850">no protein exists</text>
  </g>
  <text x="48" y="316" font-size="11.5" fill="#8A7FA3">…and two more with no evidence in any layer</text>

  <!-- the warning -->
  <rect x="24" y="336" width="410" height="118" rx="9" fill="#fbeee8" stroke="#D85A30" stroke-width="1.8"/>
  <text x="48" y="360" font-size="13" font-weight="700" fill="#a8401d">⚠️ A ✕ is not a negative result</text>
  <text x="48" y="384" font-size="12" fill="#a05a3f">It usually means "not measured in the right tissue,</text>
  <text x="48" y="402" font-size="12" fill="#a05a3f">cell type or condition". eQTL panels skip rare cell</text>
  <text x="48" y="420" font-size="12" fill="#a05a3f">types; proteomics skips low-abundance proteins.</text>
  <text x="48" y="442" font-size="12" font-weight="700" fill="#a8401d">Convergence is evidence. Absence is not.</text>

  <rect x="446" y="336" width="410" height="118" rx="9" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.8"/>
  <text x="470" y="360" font-size="13" font-weight="700" fill="#0F6E56">✅ Why this beats any single layer</text>
  <text x="470" y="384" font-size="12" fill="#3d7a68">Each layer has its own false positives, and they are</text>
  <text x="470" y="402" font-size="12" fill="#3d7a68">largely independent. A gene passing five independent</text>
  <text x="470" y="420" font-size="12" fill="#3d7a68">filters is unlikely to be five separate artifacts.</text>
  <text x="470" y="442" font-size="12" font-weight="700" fill="#0F6E56">💡 This table is a fundable figure on its own.</text>
</svg>
