<text x="196" y="334" font-size="11" fill="#8A7FA3" text-anchor="end">turned out to be:</text>
<rect x="24" y="360" width="410" height="76" rx="9" fill="#fbeee8" stroke="#D85A30" stroke-width="1.8"/>
<text x="48" y="384" font-size="12.5" font-weight="700" fill="#a8401d">⚠️ Factor 1 is almost always technical</text>
<text x="48" y="406" font-size="12" fill="#a05a3f">The strongest shared pattern is usually batch, RNA quality</text>
<text x="48" y="424" font-size="12" fill="#a05a3f">or sex — not disease. Always annotate factors first.</text>
<rect x="446" y="360" width="410" height="76" rx="9" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.8"/>
<text x="470" y="384" font-size="12.5" font-weight="700" fill="#0F6E56">✅ The useful reading is the row pattern</text>
<text x="470" y="406" font-size="12" fill="#3d7a68">Factor 2 is shared across three omics layers — that is a</text>
<text x="470" y="424" font-size="12" fill="#3d7a68">coordinated programme. Factor 3 is RNA-only: suspect first.</text>
