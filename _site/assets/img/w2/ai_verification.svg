<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="440" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">"It ran without error" is not a result. The gate is the whole method.</text>

  <!-- step 1 -->
  <rect x="24" y="56" width="190" height="72" rx="9" fill="#ffffff" stroke="#c9d9ea" stroke-width="1.5"/>
  <text x="119" y="82" font-size="13" font-weight="700" fill="#185FA5" text-anchor="middle">① Describe</text>
  <text x="119" y="102" font-size="11.5" fill="#777" text-anchor="middle">context + task +</text>
  <text x="119" y="118" font-size="11.5" fill="#777" text-anchor="middle">constraints</text>

  <path d="M214 92 L246 92" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M254 92 l-9 -5 v10 z" fill="#b9b0cc"/>

  <!-- step 2 -->
  <rect x="256" y="56" width="190" height="72" rx="9" fill="#ffffff" stroke="#c9d9ea" stroke-width="1.5"/>
  <text x="351" y="82" font-size="13" font-weight="700" fill="#185FA5" text-anchor="middle">② Generate</text>
  <text x="351" y="102" font-size="11.5" fill="#777" text-anchor="middle">the model writes code</text>
  <text x="351" y="118" font-size="11.5" fill="#777" text-anchor="middle">in two seconds</text>

  <path d="M446 92 L478 92" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M486 92 l-9 -5 v10 z" fill="#b9b0cc"/>

  <!-- THE GATE -->
  <rect x="488" y="46" width="368" height="180" rx="10" fill="#fbf7ee" stroke="#BA7517" stroke-width="2.5"/>
  <text x="512" y="74" font-size="14" font-weight="700" fill="#8a6a1f">⚠️ ③ THE GATE — you, not the model</text>
  <g font-size="12.5" fill="#7a5f2a">
    <text x="512" y="102">▸ Read every line. Any line you cannot explain</text>
    <text x="526" y="120">is a line you must ask about before running.</text>
    <text x="512" y="146">▸ Run on a subset where you know the answer.</text>
    <text x="512" y="172">▸ Check the shape: <tspan font-family="monospace" font-size="11.5" fill="#4A3D6B">nrow()</tspan>, <tspan font-family="monospace" font-size="11.5" fill="#4A3D6B">summary()</tspan>, NA count</text>
    <text x="526" y="190">before and after every join and filter.</text>
    <text x="512" y="214">▸ Ask: does this number make biological sense?</text>
  </g>

  <!-- down from gate -->
  <path d="M672 226 L672 266" stroke="#BA7517" stroke-width="2"/>
  <path d="M672 274 l-5 -9 h10 z" fill="#BA7517"/>

  <!-- step 4 -->
  <rect x="488" y="276" width="368" height="64" rx="9" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="512" y="302" font-size="13" font-weight="700" fill="#0F6E56">✅ ④ Keep it — and write why in a comment</text>
  <text x="512" y="324" font-size="12" fill="#3d7a68">The comment is for the version of you that gets the reviewer's email.</text>

  <!-- BYPASS -->
  <path d="M351 128 C 351 210, 351 250, 351 300" stroke="#D85A30" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M351 308 l-5 -9 h10 z" fill="#D85A30"/>
  <rect x="132" y="300" width="330" height="72" rx="9" fill="#fbeee8" stroke="#D85A30" stroke-width="1.5"/>
  <text x="156" y="326" font-size="13" font-weight="700" fill="#a8401d">❌ The bypass everyone takes</text>
  <text x="156" y="346" font-size="12" fill="#a05a3f">Paste ➝ it runs ➝ the plot looks plausible ➝ into the paper.</text>
  <text x="156" y="364" font-size="12" font-weight="700" fill="#a8401d">Nothing crashed. That is exactly the problem.</text>

  <!-- footer -->
  <rect x="24" y="392" width="832" height="34" rx="8" fill="#f7f5fa" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="48" y="414" font-size="12.5" fill="#555">"The AI wrote it" is not a sentence that can appear in a methods section — or in a response to reviewers.</text>
</svg>
