<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="500" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">A GWAS hit is a postcode. Post-GWAS is finding out who lives there.</text>

  <!-- start -->
  <rect x="24" y="46" width="832" height="42" rx="8" fill="#f3f0f7" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="48" y="72" font-size="13.5" fill="#555"><tspan font-family="monospace" font-weight="700" fill="#4A3D6B">rs1234567</tspan>, chr10, intergenic, p = 3×10⁻²⁴ &#8212; and nothing else known</text>

  <line x1="130" y1="88" x2="130" y2="422" stroke="#ddd7e8" stroke-width="2.5"/>

  <!-- step 1 -->
  <circle cx="130" cy="122" r="8" fill="#185FA5"/>
  <text x="130" y="126" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="160" y="116" font-size="13.5" font-weight="700" fill="#4A3D6B">Fine-mapping</text>
  <text x="160" y="134" font-size="12" fill="#8A7FA3">Which variants could plausibly be causal?</text>
  <rect x="470" y="102" width="386" height="42" rx="7" fill="#eaf1f8"/>
  <text x="488" y="120" font-size="11.5" fill="#2a5a86">SuSiE, FINEMAP → posterior probability + credible set</text>
  <text x="488" y="136" font-size="11.5" font-weight="700" fill="#a8401d">⚠️ needs an ancestry-matched LD panel</text>

  <!-- step 2 -->
  <circle cx="130" cy="196" r="8" fill="#BA7517"/>
  <text x="130" y="200" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="160" y="190" font-size="13.5" font-weight="700" fill="#4A3D6B">Functional annotation</text>
  <text x="160" y="208" font-size="12" fill="#8A7FA3">What kind of DNA is this?</text>
  <rect x="470" y="176" width="386" height="42" rx="7" fill="#f8f1e6"/>
  <text x="488" y="194" font-size="11.5" fill="#7a5f2a">coding · splice · promoter · enhancer · unknown</text>
  <text x="488" y="210" font-size="11.5" font-weight="700" fill="#a8401d">⚠️ ~90% land in "regulatory, function unclear"</text>

  <!-- step 3 -->
  <circle cx="130" cy="270" r="8" fill="#1D9E75"/>
  <text x="130" y="274" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="160" y="264" font-size="13.5" font-weight="700" fill="#4A3D6B">Variant → gene</text>
  <text x="160" y="282" font-size="12" fill="#8A7FA3">Which gene does it actually act on?</text>
  <rect x="470" y="250" width="386" height="42" rx="7" fill="#e8f5f0"/>
  <text x="488" y="268" font-size="11.5" fill="#3d7a68">eQTL colocalisation → PP.H4 &gt; 0.8 is strong evidence</text>
  <text x="488" y="284" font-size="11.5" font-weight="700" fill="#a8401d">❌ the nearest gene is wrong about half the time</text>

  <!-- step 4 -->
  <circle cx="130" cy="344" r="8" fill="#534AB7"/>
  <text x="130" y="348" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="160" y="338" font-size="13.5" font-weight="700" fill="#4A3D6B">Gene → cell type</text>
  <text x="160" y="356" font-size="12" fill="#8A7FA3">Where in the body does this matter?</text>
  <rect x="470" y="324" width="386" height="42" rx="7" fill="#eeecf8"/>
  <text x="488" y="342" font-size="11.5" fill="#4a4189">S-LDSC, sc-linker — GWAS × single-cell (W5)</text>
  <text x="488" y="358" font-size="11.5" fill="#6d6088">microglia in Alzheimer's; T cells in eczema</text>

  <!-- step 5 -->
  <circle cx="130" cy="418" r="8" fill="#D85A30"/>
  <text x="130" y="422" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="160" y="412" font-size="13.5" font-weight="700" fill="#4A3D6B">Causality &amp; direction</text>
  <text x="160" y="430" font-size="12" fill="#8A7FA3">Does it cause the disease, and which way?</text>
  <rect x="470" y="398" width="386" height="42" rx="7" fill="#fbeee8"/>
  <text x="488" y="416" font-size="11.5" fill="#a05a3f">Mendelian randomization — a lifelong natural RCT</text>
  <text x="488" y="432" font-size="11.5" font-weight="700" fill="#a8401d">⚠️ direction decides agonist vs antagonist</text>

  <!-- footer -->
  <rect x="24" y="456" width="832" height="34" rx="8" fill="#e8f5f0" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="48" y="478" font-size="13" fill="#0F6E56">✅ A mechanism claim needs <tspan font-weight="700">all four</tspan>: a variant, a gene, a cell type, and a direction. Three out of four is a hypothesis.</text>
</svg>
