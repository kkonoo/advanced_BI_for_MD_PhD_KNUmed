<text x="478" y="482" font-size="11.5" fill="#666">so a heatmap of random numbers looks structured.</text>
<text x="478" y="502" font-size="11.5" font-weight="700" fill="#a8401d">⚠️ Ask: how were these genes selected, and scaled how?</text>
