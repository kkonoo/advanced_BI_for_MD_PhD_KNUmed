<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="880" height="430" fill="#fcfcfb"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#4A3D6B">Two datasets that must never have met.</text>

  <!-- BASE -->
  <rect x="24" y="46" width="296" height="200" rx="10" fill="#ffffff" stroke="#185FA5" stroke-width="1.8"/>
  <rect x="24" y="46" width="296" height="38" rx="10" fill="#eaf1f8"/>
  <rect x="24" y="74" width="296" height="10" fill="#eaf1f8"/>
  <text x="46" y="71" font-size="13" font-weight="700" fill="#185FA5">BASE · a published GWAS</text>
  <text x="46" y="102" font-size="11.5" fill="#8A7FA3">summary statistics — no individuals</text>

  <g font-family="monospace" font-size="11.5" fill="#666">
    <text x="46"  y="128" fill="#8A7FA3">variant</text>
    <text x="158" y="128" fill="#8A7FA3" text-anchor="middle">allele</text>
    <text x="300" y="128" fill="#8A7FA3" text-anchor="end">&#946;</text>
    <text x="46"  y="150">rs1001</text><text x="158" y="150" text-anchor="middle">A</text><text x="300" y="150" text-anchor="end">0.031</text>
    <text x="46"  y="170">rs2045</text><text x="158" y="170" text-anchor="middle">T</text><text x="300" y="170" text-anchor="end">0.019</text>
    <text x="46"  y="190">rs8821</text><text x="158" y="190" text-anchor="middle">G</text><text x="300" y="190" text-anchor="end">&#8722;0.024</text>
    <text x="46"  y="210" fill="#b3aac4">&#8230; 1.1 million more</text>
  </g>
  <text x="46" y="234" font-size="11.5" fill="#8A7FA3">how much each variant counts</text>

  <!-- TARGET -->
  <rect x="560" y="46" width="296" height="200" rx="10" fill="#ffffff" stroke="#1D9E75" stroke-width="1.8"/>
  <rect x="560" y="46" width="296" height="38" rx="10" fill="#e8f5f0"/>
  <rect x="560" y="74" width="296" height="10" fill="#e8f5f0"/>
  <text x="582" y="71" font-size="13" font-weight="700" fill="#0F6E56">TARGET · your patients</text>
  <text x="582" y="102" font-size="11.5" fill="#8A7FA3">genotype dosage, 0 / 1 / 2 copies</text>

  <g font-family="monospace" font-size="11.5" fill="#666">
    <text x="664" y="128" fill="#8A7FA3" text-anchor="middle">rs1001</text>
    <text x="736" y="128" fill="#8A7FA3" text-anchor="middle">rs2045</text>
    <text x="808" y="128" fill="#8A7FA3" text-anchor="middle">rs8821</text>
    <text x="582" y="150">P-014</text><text x="664" y="150" text-anchor="middle">1</text><text x="736" y="150" text-anchor="middle">2</text><text x="808" y="150" text-anchor="middle">0</text>
    <text x="582" y="170">P-015</text><text x="664" y="170" text-anchor="middle">0</text><text x="736" y="170" text-anchor="middle">1</text><text x="808" y="170" text-anchor="middle">2</text>
    <text x="582" y="190">P-016</text><text x="664" y="190" text-anchor="middle">2</text><text x="736" y="190" text-anchor="middle">2</text><text x="808" y="190" text-anchor="middle">1</text>
    <text x="582" y="210" fill="#b3aac4">&#8230;</text>
  </g>
  <text x="582" y="234" font-size="11.5" fill="#8A7FA3">what each patient carries</text>

  <!-- centre -->
  <path d="M328 140 L354 140" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M362 140 l-9 -5 v10 z" fill="#b9b0cc"/>
  <path d="M552 140 L526 140" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M518 140 l9 -5 v10 z" fill="#b9b0cc"/>

  <rect x="368" y="92" width="144" height="98" rx="9" fill="#f3f0f7" stroke="#d8d2e4" stroke-width="1.5"/>
  <text x="440" y="118" font-size="12.5" font-weight="700" fill="#5B4D80" text-anchor="middle">multiply, sum</text>
  <text x="440" y="146" font-size="15" font-weight="700" fill="#4A3D6B" text-anchor="middle">Σ βⱼ × Gᵢⱼ</text>
  <text x="440" y="172" font-size="11.5" fill="#8A7FA3" text-anchor="middle">one number per patient</text>
  <path d="M440 190 L440 214" stroke="#b9b0cc" stroke-width="2"/>
  <path d="M440 222 l-5 -9 h10 z" fill="#b9b0cc"/>

  <rect x="336" y="224" width="208" height="30" rx="6" fill="#4A3D6B"/>
  <text x="440" y="244" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">PRS</text>

  <!-- WARNING -->
  <rect x="24" y="270" width="832" height="146" rx="10" fill="#fbeee8" stroke="#D85A30" stroke-width="2"/>
  <text x="48" y="298" font-size="14" font-weight="700" fill="#a8401d">⚠️ The two failure modes, and the only questions you need to ask</text>

  <rect x="48" y="312" width="386" height="88" rx="8" fill="#ffffff"/>
  <text x="68" y="336" font-size="12.5" font-weight="700" fill="#4A3D6B">① Did any target individual sit in the base GWAS?</text>
  <text x="68" y="358" font-size="12" fill="#666">Then the score has partly memorised their disease status.</text>
  <text x="68" y="378" font-size="12" font-weight="700" fill="#a8401d">Performance is inflated — sometimes by a lot.</text>

  <rect x="452" y="312" width="386" height="88" rx="8" fill="#ffffff"/>
  <text x="472" y="336" font-size="12.5" font-weight="700" fill="#4A3D6B">② Where was the p-value threshold tuned?</text>
  <text x="472" y="358" font-size="12" fill="#666">If on the same people the AUC is reported in —</text>
  <text x="472" y="378" font-size="12" font-weight="700" fill="#a8401d">that AUC is a description, not a prediction.</text>
</svg>
